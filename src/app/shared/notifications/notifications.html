<div
  class="fixed z-50 left-1/2 -translate-x-1/2 w-full max-w-md px-4 py-3 rounded-xl shadow-lg border
         bg-rose-50 border-rose-300 text-rose-900 flex items-start justify-between gap-3"
  [style.top.px]="16 + index() * 64">

  <div class="flex items-start gap-2 text-sm leading-snug">
    <span class="text-lg">#WarnIcon</span> <!--get a warning icon and an x icon for close-->
    <ng-content />
  </div>

  <button
    type="button"
    class="shrink-0 text-rose-600 hover:text-rose-900 font-bold text-lg leading-none transition"
    (click)="dismiss()">
    x
  </button>
</div>
