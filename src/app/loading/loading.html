<div class="min-h-screen bg-amber-50 flex flex-col items-center justify-center px-4 py-16 gap-8">

  @if (!showGif()) {
    <div class="text-6xl animate-bounce">☕️w</div>

    <div class="text-center space-y-2">
      <h2 class="text-2xl font-bold text-amber-900">Processing your order...</h2>
      <p class="text-amber-600 italic text-sm animate-pulse">{{ progressMessage() }}</p>
    </div>

    <div class="w-full max-w-sm space-y-2">
      <z-progress-bar [zIndeterminate]="true" zSize="lg" />
      <p class="text-center text-xs text-neutral-400">
        Current charge: <span class="text-red-500 font-bold">R{{ displayTotal() }}</span>
        <span class="ml-1 text-neutral-300">(and counting)</span>
      </p>
    </div>

  }

</div>
