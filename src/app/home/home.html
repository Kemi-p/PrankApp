<div class="min-h-screen flex flex-col">
  <div class="relative h-[55vh] w-full overflow-hidden">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwgQ-SJA4mwgAHWAQJfHaTV_rG78OIwWle7g&s"
      alt="Coffee hero"
      class="w-full h-full object-cover"
    />

    <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
      <div class="text-center text-white px-4">
        <h1 class="text-4xl md:text-5xl font-bold drop-shadow-lg">
          A simple way to order coffee...
        </h1>
      </div>
    </div>
  </div>

  <div class="flex flex-col items-center justify-center flex-1 bg-stone-100 gap-6 py-16 px-4">
    <div class="text-center space-y-2">
      <h2 class="text-3xl font-bold text-stone-900">Welcome to The R5 Shop</h2>

      <p class="text-stone-600 text-sm max-w-sm mx-auto">
        Every single item on our menu is priced as R5. No hidden fees. No surprises. We promise.*
      </p>

      <p class="text-xs text-neutral-200 italic">*We do not promise. It's a lie</p>
    </div>

    <button z-button zSize="lg" zShape="circle" (click)="startOrder()" class="gap-2 px-8 text-base">
      <span>▶</span> Start Order
    </button>
  </div>
</div>
